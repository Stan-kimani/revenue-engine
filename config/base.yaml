# config/base.yaml
# Global defaults: models, caps, schedules (build-spec §2). Loaded, validated
# and typed by core/config.py (M0.4).

queue:
  max_attempts: 5 # after this many attempts, a job dead-letters instead of retrying
  backoff_base_s: 2 # full-jitter backoff: min(cap, base * 2^attempts) * uniform(0.5, 1.0)
  backoff_cap_s: 300
  visibility_timeout_s: 300 # a 'running' job whose lock is older than this is reclaimed

# Tier -> Claude API model ID (build-spec §6: "Never hardcode a model name in
# a prompt file"). A prompt's frontmatter names a tier, never a model — core/llm.py
# resolves the mapping here so switching models is a one-line config edit.
#
# All three model IDs are permanently pinned snapshots, re-verified against
# https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions
# and https://platform.claude.com/docs/en/about-claude/pricing on 2026-08-12 —
# see docs/decisions.md for the full verification note, including why
# `claude-sonnet-5` / `claude-opus-5` (dateless) are NOT aliases despite
# looking like ones: for the Claude 4.6+ generation, the dateless ID IS the
# canonical pinned snapshot ("A 4.6-generation ID such as claude-sonnet-4-6 is
# not an alias. It is the snapshot." — Anthropic's own docs name this exact
# assumption as a common misconception). There is no separate dated form to
# pin to for Sonnet 5 or Opus 5. `claude-haiku-4-5-20251001` (pre-4.6
# generation) is the actual dated snapshot; `claude-haiku-4-5` (no date) would
# be the convenience alias — deliberately not used here.
#
# $/MTok pricing confirmed current (not introductory-and-about-to-change) on
# 2026-08-12: Anthropic's pricing page now states the Sonnet 5 introductory
# rate ($2/$10) "is now the standard price" and the previously scheduled
# September 1, 2026 increase to $3/$15 "will not occur" — the prior entry
# here used $3/$15 as a deliberate hedge against that scheduled increase;
# that hedge is now stale and has been removed in favour of the actual,
# confirmed-permanent rate.
# SDK transport-layer settings for the AsyncAnthropic client (core/llm.py).
# These are distinct from complete_json()'s own validation retry (_MAX_ATTEMPTS=2):
#   - timeout_s: maximum seconds to wait for a single API response. A hung
#     request raises httpx.ReadTimeout, which propagates up as a transport
#     error rather than a silent hang.
#   - max_client_retries: number of times the SDK will transparently re-send a
#     request on transient transport failures (network errors, 429 rate limits,
#     5xx). These happen inside a single `await client.messages.create()` call
#     and are invisible to complete_json()'s `attempt` counter — they must
#     never be confused with the validation-level retries recorded in
#     agent_runs.retry_count. See docs/decisions.md, 2026-08-13 entry.
llm:
  timeout_s: 60
  max_client_retries: 2

models:
  fast:
    model: claude-haiku-4-5-20251001
    input_cost_per_mtok: 1
    output_cost_per_mtok: 5
  standard:
    model: claude-sonnet-5
    input_cost_per_mtok: 2
    output_cost_per_mtok: 10
  deep:
    model: claude-opus-5
    input_cost_per_mtok: 5
    output_cost_per_mtok: 25

# docs/deliverability.md §4 (send caps and pacing) and §6 (health thresholds).
# Every number here is read at runtime by core/sending.py — none is hardcoded in
# the send path. Loaded and validated by core/config.py; the worker refuses to
# boot on an invalid block.
deliverability:
  sending_domain: getkimani.com
  from_address: kimani@getkimani.com
  daily_cap: 5 # rolling 24h, not a calendar day. Raised manually per the §3 warmup table.
  hourly_cap: 3 # rolling 60 minutes
  min_gap_seconds: 180 # minimum spacing between sends on the domain
  jitter_seconds: 420 # random extra delay (0..jitter) added before every send attempt
  send_window_start: "08:00" # recipient-local
  send_window_end: "17:00"
  send_days: [mon, tue, wed, thu, fri]
  timezone_source: recipient
  # Business hours to assume for a recipient we cannot place (no contact
  # timezone, no mapped company country). This is NOT the sender's timezone:
  # the ICP is US/UK/EU, so 08:00 wherever the sender sits is the wrong clock.
  default_recipient_timezone: America/New_York
  # companies.country -> timezone. Multi-zone countries map to their most
  # populous business zone; a contact-level timezone attribute, when enrichment
  # has one, takes precedence over this.
  country_timezones:
    US: America/New_York
    CA: America/Toronto
    UK: Europe/London
    GB: Europe/London
    IE: Europe/Dublin
    DE: Europe/Berlin
    FR: Europe/Paris
    NL: Europe/Amsterdam
    ES: Europe/Madrid
    IT: Europe/Rome
    SE: Europe/Stockholm
    AU: Australia/Sydney
    NZ: Pacific/Auckland
    AE: Asia/Dubai
    SG: Asia/Singapore
    KE: Africa/Nairobi
    ZA: Africa/Johannesburg
  # Three tiers (docs/deliverability.md §5). EVERY EmailStatus must appear in
  # exactly one tier or the config loader refuses to boot — a status added
  # later can never default to sendable by omission.
  #   send:       verified mailbox, send normally
  #   restricted: sendable, but capped by catch_all_share and its bounces
  #               count double toward the §6 health thresholds
  #   never:      not sendable, for any reason, ever
  # role_based is never-send on two grounds, not one: bounce risk AND a shared
  # inbox where cold email is deleted unread.
  email_status_tiers:
    send: [valid]
    restricted: [catch_all]
    never: [unverified, risky, invalid, bounced, suppressed, disposable, role_based]
  # Fraction of daily_cap available to catch-all recipients (floored, minimum
  # 1). A share, not an absolute: daily_cap climbs 5 -> 40 across warmup and a
  # hardcoded 2 would quietly become absurd at 40/day. No hourly sub-cap —
  # hourly_cap and min_gap_seconds already bind.
  catch_all_share: 0.4
  # A bounce from a catch-all domain is worth two: acceptance there never
  # proved the mailbox existed, so a bounce is the first real evidence.
  bounce_weight_by_status:
    catch_all: 2.0
  # Detected in code as well as by the verifier — these are recognisable
  # without spending a credit, and the tier is never-send either way.
  role_based_local_parts:
    [info, sales, admin, support, hello, contact, billing, office, team, accounts, enquiries]
  # §7 message-level requirements, appended to every draft BEFORE approval so
  # the approver sees exactly what sends, and re-checked at send time.
  max_links: 1
  opt_out_sentence: "If this isn't relevant, reply \"stop\" and I won't contact you again."
  # CAN-SPAM requires a real postal address. Empty = the content gate refuses
  # every send until it is set (deliverability.md §10 pre-flight checklist).
  physical_address: ""
  # Maximum seconds between a send being authorized (gates passed, reservation
  # committed) and the Gmail call. Keeps the unavoidable commit-to-send window
  # small; an older authorization is refused rather than used.
  authorization_ttl_seconds: 60
  gmail_timeout_seconds: 30 # per Gmail API request; a timeout is recorded as send_unknown, never retried
  health:
    window_days: 7
    # Below this many sends in the window, rates are statistically meaningless
    # (one bounce in 35 sends reads as 2.9%). Absolute counts apply instead.
    sample_floor_sends: 50
    below_floor_pause_counts:
      hard_bounce: 2
      spam_complaint: 1
    # At or above the floor, §6's rates apply as written.
    rates:
      bounce:
        warn: 0.02
        pause: 0.03
      spam_complaint:
        warn: 0.0005
        pause: 0.001
      unsubscribe:
        warn: 0.02
        pause: 0.05
