# config/base.yaml
# Global defaults: models, caps, schedules (build-spec §2). Loaded, validated
# and typed by core/config.py (M0.4).

queue:
  max_attempts: 5 # after this many attempts, a job dead-letters instead of retrying
  backoff_base_s: 2 # full-jitter backoff: min(cap, base * 2^attempts) * uniform(0.5, 1.0)
  backoff_cap_s: 300
  visibility_timeout_s: 300 # a 'running' job whose lock is older than this is reclaimed

# Tier -> Claude API model ID (build-spec §6: "Never hardcode a model name in
# a prompt file"). A prompt's frontmatter names a tier, never a model — core/llm.py
# resolves the mapping here so switching models is a one-line config edit.
#
# All three model IDs are permanently pinned snapshots, re-verified against
# https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions
# and https://platform.claude.com/docs/en/about-claude/pricing on 2026-08-12 —
# see docs/decisions.md for the full verification note, including why
# `claude-sonnet-5` / `claude-opus-5` (dateless) are NOT aliases despite
# looking like ones: for the Claude 4.6+ generation, the dateless ID IS the
# canonical pinned snapshot ("A 4.6-generation ID such as claude-sonnet-4-6 is
# not an alias. It is the snapshot." — Anthropic's own docs name this exact
# assumption as a common misconception). There is no separate dated form to
# pin to for Sonnet 5 or Opus 5. `claude-haiku-4-5-20251001` (pre-4.6
# generation) is the actual dated snapshot; `claude-haiku-4-5` (no date) would
# be the convenience alias — deliberately not used here.
#
# $/MTok pricing confirmed current (not introductory-and-about-to-change) on
# 2026-08-12: Anthropic's pricing page now states the Sonnet 5 introductory
# rate ($2/$10) "is now the standard price" and the previously scheduled
# September 1, 2026 increase to $3/$15 "will not occur" — the prior entry
# here used $3/$15 as a deliberate hedge against that scheduled increase;
# that hedge is now stale and has been removed in favour of the actual,
# confirmed-permanent rate.
# SDK transport-layer settings for the AsyncAnthropic client (core/llm.py).
# These are distinct from complete_json()'s own validation retry (_MAX_ATTEMPTS=2):
#   - timeout_s: maximum seconds to wait for a single API response. A hung
#     request raises httpx.ReadTimeout, which propagates up as a transport
#     error rather than a silent hang.
#   - max_client_retries: number of times the SDK will transparently re-send a
#     request on transient transport failures (network errors, 429 rate limits,
#     5xx). These happen inside a single `await client.messages.create()` call
#     and are invisible to complete_json()'s `attempt` counter — they must
#     never be confused with the validation-level retries recorded in
#     agent_runs.retry_count. See docs/decisions.md, 2026-08-13 entry.
llm:
  timeout_s: 60
  max_client_retries: 2

models:
  fast:
    model: claude-haiku-4-5-20251001
    input_cost_per_mtok: 1
    output_cost_per_mtok: 5
  standard:
    model: claude-sonnet-5
    input_cost_per_mtok: 2
    output_cost_per_mtok: 10
  deep:
    model: claude-opus-5
    input_cost_per_mtok: 5
    output_cost_per_mtok: 25
