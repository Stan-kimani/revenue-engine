[project]
name = "revenue-engine"
version = "0.1.0"
description = "AI Revenue Engine — autonomous multi-agent revenue system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
    "langfuse>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revenue_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "golden: calls a real LLM and costs money; excluded by default",
    "integration: runs against a real Postgres instance",
    "protected: encodes a business rule from an explicit instruction; never weaken to make it pass (CLAUDE.md workflow rules)",
]
addopts = "-m 'not golden'"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "prompts", "schemas", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["asyncpg", "jsonschema", "yaml", "langfuse", "langfuse.*"]
ignore_missing_imports = true
