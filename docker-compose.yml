services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revenue_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revenue_engine}
      POSTGRES_DB: ${POSTGRES_DB:-revenue_engine}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revenue_engine} -d ${POSTGRES_DB:-revenue_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
